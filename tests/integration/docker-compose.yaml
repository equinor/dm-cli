services:
  dmss:
    image: datamodelingtool.azurecr.io/dmss:v1.29.0
    restart: unless-stopped
    environment:
      AUTH_ENABLED: 0
      ENVIRONMENT: local
      MONGO_USERNAME: maf
      MONGO_PASSWORD: maf
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: maf
      REDIS_URL: redis://:maf@redis:6379/0
      SECRET_KEY: sg9aeUM5i1JO4gNN8fQadokJa3_gXQMLBjSGGYcfscs= # Don't reuse this in production...
    ports:
      - "5000:5000"
    depends_on:
      - db
      - redis

  db:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: maf
      MONGO_INITDB_ROOT_PASSWORD: maf

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --requirepass maf
    environment:
      REDIS_PASSWORD: maf

